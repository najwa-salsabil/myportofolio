<div id="edit-achievement-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-achievement-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-achievement-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit pencapaian"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-achievement-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit pencapaian">×</button>

        <h2 id="edit-achievement-modal-title">Edit Pencapaian</h2>
        <form id="achievement-edit-form" class="project-form">
            <div class="form-group">
                <label for="edit-title">Nama/Kompetisi</label>
                <input type="text" id="edit-title" name="title" maxlength="225" required>
            </div>
            <div class="form-group">
                <label for="edit-rank">Juara/Peran</label>
                <input type="text" id="edit-rank" name="rank" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="edit-year">Tahun</label>
                <input type="number" id="edit-year" name="year" required>
            </div>
            <div class="form-group">
                <label for="edit-description">Deskripsi (opsional)</label>
                <textarea id="edit-description" name="description" rows="3"></textarea>
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-achievement-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
